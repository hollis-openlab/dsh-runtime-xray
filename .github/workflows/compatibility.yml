name: compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig*.json'
      - 'scripts/**'
      - '.github/workflows/compatibility.yml'

jobs:
  node-matrix:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.19.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
